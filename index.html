<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insurance RAG — find a plan</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2;
    --panel: #ffffff;
    --border: #ddd8ce;
    --text: #232019;
    --muted: #6b6558;
    --accent: #8a5a3b;
    --accent-text: #ffffff;
    --bubble-user: #ece7dd;
    --bubble-assistant: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1914;
      --panel: #262319;
      --border: #3a3629;
      --text: #ece7dc;
      --muted: #a39a86;
      --accent: #c98a5e;
      --accent-text: #1b1914;
      --bubble-user: #33301f;
      --bubble-assistant: #262319;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 1.1rem;
    margin: 0 0 2px;
  }
  header p {
    margin: 0;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 0.95rem;
    white-space: pre-wrap;
    border: 1px solid var(--border);
  }
  .msg.assistant {
    background: var(--bubble-assistant);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: var(--bubble-user);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.error {
    border-color: #b3564a;
    color: #b3564a;
  }
  .candidates {
    align-self: flex-start;
    max-width: 85%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .candidate {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.85rem;
    background: var(--panel);
  }
  .candidate .rank { font-weight: 600; color: var(--accent); }
  .candidate .policy { font-weight: 600; }
  .candidate .premium { color: var(--muted); }
  #composerArea {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  form {
    display: flex;
    gap: 8px;
  }
  input[type="text"], input[type="number"] {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.95rem;
  }
  input[type="text"]:focus, input[type="number"]:focus { outline: 2px solid var(--accent); }
  button {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-style: italic; font-size: 0.85rem; align-self: flex-start; }
  .restart-row { padding: 0 20px 12px; }
  .restart-row button { background: transparent; color: var(--muted); border: 1px solid var(--border); font-size: 0.8rem; padding: 6px 12px; }
  .option-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .option-buttons button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .option-buttons button:hover:not(:disabled) { border-color: var(--accent); }
  .checkbox-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }
  .checkbox-list label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .checkbox-list input { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Find a term insurance plan</h1>
    <p>Answer a few questions — no jargon needed, just what matters to you.</p>
  </header>
  <div id="thread"></div>
  <div class="restart-row" id="restartRow" style="display:none;">
    <button id="restartBtn" type="button">Start over</button>
  </div>
  <div id="composerArea"></div>
</div>

<script>
// Fill in your n8n production webhook URL (from the imported
// insurance_rag_frontend_webhook.json workflow — n8n's default production path is
// https://<your-n8n-domain>/webhook/<path>, e.g.
// https://gaurav-n8n.duckdns.org/webhook/insurance-rag-frontend).
const WEBHOOK_URL = "https://gaurav-n8n.duckdns.org/webhook/insurance-rag-frontend";

const thread = document.getElementById("thread");
const composerArea = document.getElementById("composerArea");
const restartRow = document.getElementById("restartRow");
const restartBtn = document.getElementById("restartBtn");

let sessionId = null;
let done = false;
let busy = false;

function addMessage(text, role) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;
  return el;
}

function addCandidates(top3) {
  if (!top3 || top3.length === 0) return;
  const wrap = document.createElement("div");
  wrap.className = "candidates";
  for (const c of top3) {
    const row = document.createElement("div");
    row.className = "candidate";
    const label = c.plan_name ? c.plan_name : "Policy " + c.policy_id;
    row.innerHTML =
      '<span class="rank">Rank ' + c.rank + '</span> — ' +
      '<span class="policy">' + label + '</span> — ' +
      '<span class="premium">₹' + Math.round(c.premium_amount).toLocaleString("en-IN") + '/yr</span>';
    wrap.appendChild(row);
  }
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
}

function setBusy(b) {
  busy = b;
  composerArea.querySelectorAll("input, button").forEach((el) => (el.disabled = b));
}

async function callWebhook(message) {
  const resp = await fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, message: message }),
  });
  if (!resp.ok) {
    throw new Error("Request failed (" + resp.status + ")");
  }
  return resp.json();
}

// Central submit path every widget type below funnels through - displayText is what shows
// in the user's own chat bubble (e.g. selected labels), messageText is the raw value sent
// to /chat (must match what service/chat_session.py's _parse_field() expects for that
// field - each render*() function below builds this correctly per field type).
async function submitAnswer(displayText, messageText) {
  if (done || busy) return;
  addMessage(displayText, "user");
  setBusy(true);
  const typing = addMessage("…", "typing");
  try {
    const data = await callWebhook(messageText);
    typing.remove();
    addMessage(data.reply, "assistant");
    if (data.done) {
      done = true;
      addCandidates(data.top3);
      restartRow.style.display = "block";
      composerArea.innerHTML = "";
    } else {
      renderComposer(data.field);
    }
  } catch (err) {
    typing.remove();
    addMessage("Couldn't reach the server: " + err.message, "error");
  }
  setBusy(false);
}

// Widget renderers - one per _field_meta() "type" (service/chat_session.py). Each builds
// its own DOM into composerArea and wires submission through submitAnswer() above, so the
// backend's real, currently-valid options (term/premium_payment_option) drive what's
// selectable at all, instead of a free-text box a user can type anything into - added
// 2026-08-13 in response to a user pushback on continuing to patch free-text parsing edge
// cases one at a time ("we can't keep building more for every case").

function renderTextInput(field) {
  composerArea.innerHTML =
    '<form id="textForm"><input type="text" id="textInput" autocomplete="off" ' +
    'placeholder="Type your answer…" autofocus><button type="submit">Send</button></form>';
  const form = document.getElementById("textForm");
  const textInput = document.getElementById("textInput");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const value = textInput.value.trim();
    if (!value) return;
    submitAnswer(value, value);
  });
  textInput.focus();
}

function renderNumberInput(field) {
  const attrs = [];
  if (field.min !== undefined && field.min !== null) attrs.push('min="' + field.min + '"');
  if (field.max !== undefined && field.max !== null) attrs.push('max="' + field.max + '"');
  if (field.step !== undefined && field.step !== null) attrs.push('step="' + field.step + '"');
  composerArea.innerHTML =
    '<form id="numForm"><input type="number" id="numInput" autocomplete="off" ' +
    attrs.join(" ") + ' autofocus><button type="submit">Send</button></form>';
  const form = document.getElementById("numForm");
  const numInput = document.getElementById("numInput");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const value = numInput.value.trim();
    if (!value) return;
    submitAnswer(value, value);
  });
  numInput.focus();
}

function renderSelectButtons(field) {
  const wrap = document.createElement("div");
  wrap.className = "option-buttons";
  for (const opt of field.options) {
    const isObj = typeof opt === "object" && opt !== null;
    const value = isObj ? opt.value : opt;
    const label = isObj ? opt.label : String(opt);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = label;
    btn.addEventListener("click", () => submitAnswer(label, String(value)));
    wrap.appendChild(btn);
  }
  composerArea.innerHTML = "";
  composerArea.appendChild(wrap);
}

function renderMultiSelect(field) {
  const list = document.createElement("div");
  list.className = "checkbox-list";
  for (const opt of field.options) {
    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = String(opt.value);
    checkbox.dataset.label = opt.label;
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(opt.label));
    list.appendChild(label);
  }
  const continueBtn = document.createElement("button");
  continueBtn.type = "button";
  continueBtn.textContent = "Continue";
  continueBtn.addEventListener("click", () => {
    const checked = Array.from(list.querySelectorAll("input:checked"));
    if (checked.length === 0) return;
    const messageText = checked.map((c) => c.value).join(",");
    const displayText = checked.map((c) => c.dataset.label).join(", ");
    submitAnswer(displayText, messageText);
  });
  composerArea.innerHTML = "";
  composerArea.appendChild(list);
  composerArea.appendChild(continueBtn);
}

function renderComposer(field) {
  if (!field || field.type === "text") {
    renderTextInput(field);
  } else if (field.type === "number") {
    renderNumberInput(field);
  } else if (field.type === "select") {
    renderSelectButtons(field);
  } else if (field.type === "multiselect") {
    renderMultiSelect(field);
  } else {
    renderTextInput(field);
  }
}

async function start() {
  sessionId = crypto.randomUUID();
  done = false;
  thread.innerHTML = "";
  restartRow.style.display = "none";
  composerArea.innerHTML = "";
  const typing = addMessage("…", "typing");
  try {
    const data = await callWebhook(null);
    typing.remove();
    addMessage(data.reply, "assistant");
    renderComposer(data.field);
  } catch (err) {
    typing.remove();
    addMessage("Couldn't reach the server: " + err.message, "error");
  }
}

restartBtn.addEventListener("click", start);

start();
</script>
</body>
</html>
